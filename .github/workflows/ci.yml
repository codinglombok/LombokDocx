# CI — LombokDocx: one job per language folder (LombokVector pattern).
# The TypeScript reference lives at the repository root; the python/, go/ and
# php/ jobs stay declared (guarded by hashFiles) so they turn green-skipped
# until their ports land, and activate automatically afterwards.
name: CI

permissions:
  contents: read

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run coverage
      - run: npm run build

  python:
    name: Python ${{ matrix.python }} (${{ matrix.os }})
    if: ${{ hashFiles('python/**/*.py') != '' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.11", "3.13"]
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest coverage
      - run: python -m coverage run --branch --source=lombokdocx -m pytest -q
      - run: python -m coverage report -m --fail-under=90

  go:
    name: Go ${{ matrix.go }} (${{ matrix.os }})
    if: ${{ hashFiles('go/**/*.go') != '' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go: ["1.22", "1.24"]
    defaults:
      run:
        working-directory: go
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: gofmt
        if: runner.os == 'Linux'
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "not gofmt-formatted:"; echo "$out"; exit 1; fi
      - run: go vet ./...
      - run: go test -coverprofile=cover.out ./...
      - name: Coverage >= 90%
        run: |
          total=$(go tool cover -func=cover.out | awk '/^total:/ {sub("%","",$3); print $3}')
          echo "coverage: $total%"
          awk -v t="$total" 'BEGIN { exit !(t >= 90) }'

  php:
    name: PHP ${{ matrix.php }} (${{ matrix.os }})
    if: ${{ hashFiles('php/src/**/*.php') != '' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        php: ["8.1", "8.3"]
    defaults:
      run:
        working-directory: php
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: pcov
          tools: none
      - name: Lint
        shell: bash
        run: for f in $(find src tests -name '*.php'); do php -l "$f" > /dev/null || exit 1; done
      - run: php -d pcov.enabled=1 -d pcov.directory=src tests/run.php --coverage=90

  standards:
    name: Standards (vectors, doctor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
      - name: Vector file matches its source and SHA256SUMS
        run: |
          python3 vectors/build_vectors.py
          git diff --exit-code vectors/lombokdocx-vectors-v1.json
          sha256sum -c vectors/SHA256SUMS
      - run: npm ci
      - name: lombok doctor
        env:
          LOMBOK_PRIVACY_TERMS: ${{ secrets.LOMBOK_PRIVACY_TERMS }}
        run: bash scripts/lombok-doctor.sh LombokDocx
      - run: npm run build
      - run: npm pack --dry-run
      - run: npm audit --omit=dev --audit-level=high
      - name: Fuzz XML parser and package reader
        run: npm run fuzz
        env:
          FUZZ_EXECUTIONS: "100000"
